name: Portable RTS core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test verification and progress regressions
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Compile, test and validate source
        run: python3 Tools/verify.py --core-only
      - name: Validate CMake and CTest integration
        run: |
          cmake -S Core -B .artifacts/cmake-core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build .artifacts/cmake-core --parallel 2
          ctest --test-dir .artifacts/cmake-core --output-on-failure
      - name: Validate address, undefined behavior and leak sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S Core -B .artifacts/cmake-core-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DWILDLIGHT_SANITIZE=ON
          cmake --build .artifacts/cmake-core-sanitized --parallel 2
          ctest --test-dir .artifacts/cmake-core-sanitized --output-on-failure
      - name: Attach verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification
          path: .artifacts/verification.json
